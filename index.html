<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EBEAE6" />
    <!--
      Preload apenas da fonte crítica: a Archivo latin pinta o herói e a navegação.
      A Newsreader só aparece em prosa abaixo da dobra e não deve disputar banda.
    -->
    <link
      rel="preload"
      href="/fonts/archivo-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Título e meta tags de cada página vêm de <SeoHead> (src/lib/seo.tsx) -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
